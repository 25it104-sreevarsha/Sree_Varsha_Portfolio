  <path d="M90 320 C90 258 128 228 175 228 C222 228 260 258 260 320" fill="#131726" stroke="url(#rim)" stroke-width="2" stroke-linecap="round"/>

  <!-- Optical Axis Lines -->
  <line x1="175" y1="75" x2="175" y2="95" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="100" y1="155" x2="115" y2="155" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="235" y1="155" x2="250" y2="155" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Status Pill -->
  <rect x="55" y="346" width="240" height="44" rx="10" fill="#07080C" fill-opacity="0.88" stroke="#7C3AED" stroke-opacity="0.45"/>
  <text x="175" y="365" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1.8">PASSPORT FRAME [3.5 : 4.5]</text>
  <text x="175" y="381" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="9" letter-spacing="1.2">UPLOAD REAL PHOTO IN STUDIO</text>
